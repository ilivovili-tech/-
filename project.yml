name: XiangCe
options:
  bundleIdPrefix: com.ilivovili
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 相册
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 相册需要访问照片图库，以便按时间整理和展示你的照片。
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 相册仅在你主动选择保存时请求添加照片权限。
    INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
targets:
  XiangCe:
    type: application
    platform: iOS
    sources:
      - path: Album
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilivovili.xiangce
        PRODUCT_NAME: XiangCe
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
